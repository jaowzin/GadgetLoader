name: Build GadgetLoader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Download official Frida Gadget 17.17.0 ARM64
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -L --fail --retry 3 \
            "https://github.com/frida/frida/releases/download/17.17.0/frida-gadget-17.17.0-android-arm64.so.xz" \
            -o /tmp/frida-gadget.so.xz
          echo "942b66a229da11f1dda38c2c3c126bf23df76c0febc0925b6a5decc04687e871  /tmp/frida-gadget.so.xz" | sha256sum -c -
          xz -dc /tmp/frida-gadget.so.xz > app/src/main/jniLibs/arm64-v8a/libgadget.so
          test -s app/src/main/jniLibs/arm64-v8a/libgadget.so

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare direct APK
        run: cp app/build/outputs/apk/debug/app-debug.apk GadgetLoader-v0.1.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GadgetLoader-debug
          path: GadgetLoader-v0.1.0.apk
          if-no-files-found: error
