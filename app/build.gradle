plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.gadgetloader.app'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.gadgetloader.app'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
        doNotStrip '**/libgadget.config.so'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}
